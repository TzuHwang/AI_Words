[tool.poetry]
name = "ai-words"
version = "0.1.0"
description = "A LibreOffice-style ODT document editor with a streaming AI assistant."
authors = ["TzuHwang <phoenixteally@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
fastapi = ">=0.110"
uvicorn = ">=0.29"
python-multipart = ">=0.0.9"
odfpy = ">=1.4.1"
httpx = ">=0.27"
anthropic = ">=0.40"
truststore = ">=0.9"  # trust the OS certificate store (corporate proxy / MITM CA)

[tool.poetry.group.dev.dependencies]
# Dev-only tools. Installed with `poetry install`, excluded from the Docker
# image (which uses `poetry install --only main`).
pytest = ">=8.0"
# Drives a real browser for tests/test_ui.py. The package alone is not enough —
# the browser binary is a separate download (`playwright install chromium`), and
# those tests skip without it, so this stays cheap for anyone who never runs it.
pytest-playwright = ">=0.8"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poetry.scripts]
ai-words = "app.__main__:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
