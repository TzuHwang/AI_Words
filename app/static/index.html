<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Words</title>
  <link rel="stylesheet" href="/static/style.css?v=5">
</head>
<body>
  <div id="app">
    <!-- Left: document editor (LibreOffice Writer style) -->
    <section id="editor-pane">
      <input type="file" id="file-input" accept=".odt,.html,.htm" hidden>

      <!-- Menu bar -->
      <nav class="lo-menubar" id="menubar">
        <div class="lo-menu" data-menu="file">
          <span class="lo-menu-label">File</span>
          <div class="lo-menu-list">
            <button data-act="home">Home…</button>
            <div class="lo-menu-sep"></div>
            <button data-act="new">New</button>
            <button data-act="open">Open…</button>
            <div class="lo-menu-sep"></div>
            <button data-act="save">Save <span class="lo-menu-key">Ctrl+S</span></button>
            <div class="lo-menu-sep"></div>
            <button data-act="save-odt">Export as ODT</button>
            <button data-act="save-html">Export as HTML</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="edit">
          <span class="lo-menu-label">Edit</span>
          <div class="lo-menu-list">
            <button data-cmd="undo">Undo</button>
            <button data-cmd="redo">Redo</button>
            <div class="lo-menu-sep"></div>
            <button data-cmd="cut">Cut</button>
            <button data-cmd="copy">Copy</button>
            <button data-cmd="paste">Paste</button>
            <div class="lo-menu-sep"></div>
            <button data-cmd="selectAll">Select All</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="insert">
          <span class="lo-menu-label">Insert</span>
          <div class="lo-menu-list">
            <button data-act="insert-hr">Horizontal Rule</button>
            <button data-act="insert-page-break">Page Break</button>
            <button data-act="insert-table">Table…</button>
            <button data-act="insert-link">Hyperlink…</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="format">
          <span class="lo-menu-label">Format</span>
          <div class="lo-menu-list">
            <button data-cmd="bold">Bold</button>
            <button data-cmd="italic">Italic</button>
            <button data-cmd="underline">Underline</button>
            <button data-cmd="strikeThrough">Strikethrough</button>
            <div class="lo-menu-sep"></div>
            <button data-cmd="removeFormat">Clear Direct Formatting</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="table">
          <span class="lo-menu-label">Table</span>
          <div class="lo-menu-list">
            <button data-act="insert-table">Insert Table…</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="tools">
          <span class="lo-menu-label">Tools</span>
          <div class="lo-menu-list">
            <button data-act="skills">Skills…</button>
          </div>
        </div>
        <div class="lo-menu" data-menu="help">
          <span class="lo-menu-label">Help</span>
          <div class="lo-menu-list">
            <button data-act="about">About AI Words</button>
          </div>
        </div>
      </nav>

      <!-- Formatting toolbar -->
      <div class="lo-toolbar" id="toolbar">
        <button class="lo-tb-btn" data-act="new" title="New">🗎</button>
        <button class="lo-tb-btn" data-act="open" title="Open">📂</button>
        <div class="lo-dropdown">
          <button class="lo-tb-btn" data-act="save-menu" title="Save / Export">💾 ▾</button>
          <div class="lo-menu-list" id="save-menu">
            <button data-act="save">Save to file <span class="lo-menu-key">Ctrl+S</span></button>
            <button data-act="save-odt">Export as ODT</button>
            <button data-act="save-html">Export as HTML</button>
          </div>
        </div>
        <span class="lo-tb-sep"></span>
        <button class="lo-tb-btn" data-cmd="undo" title="Undo">↶</button>
        <button class="lo-tb-btn" data-cmd="redo" title="Redo">↷</button>
        <span class="lo-tb-sep"></span>

        <select class="lo-combo lo-style" id="style-select" title="Paragraph style">
          <option value="p">Default Paragraph Style</option>
          <option value="h1">Heading 1</option>
          <option value="h2">Heading 2</option>
          <option value="h3">Heading 3</option>
          <option value="pre">Preformatted Text</option>
          <option value="blockquote">Quotation</option>
        </select>
        <select class="lo-combo lo-font" id="font-select" title="Font name">
          <optgroup label="中文字體">
            <option value="&quot;新細明體&quot;, PMingLiU, serif">新細明體 (PMingLiU)</option>
            <option value="&quot;細明體&quot;, MingLiU, serif">細明體 (MingLiU)</option>
            <option value="&quot;標楷體&quot;, DFKai-SB, BiauKai, cursive">標楷體 (DFKai-SB)</option>
            <option value="&quot;微軟正黑體&quot;, &quot;Microsoft JhengHei&quot;, sans-serif">微軟正黑體 (JhengHei)</option>
            <option value="&quot;微軟雅黑&quot;, &quot;Microsoft YaHei&quot;, sans-serif">微軟雅黑 (YaHei)</option>
            <option value="&quot;宋體&quot;, SimSun, serif">宋體 (SimSun)</option>
            <option value="&quot;黑體&quot;, SimHei, sans-serif">黑體 (SimHei)</option>
            <option value="&quot;楷體&quot;, KaiTi, cursive">楷體 (KaiTi)</option>
            <option value="&quot;Noto Sans TC&quot;, sans-serif">Noto Sans TC</option>
            <option value="&quot;Noto Serif TC&quot;, serif">Noto Serif TC</option>
          </optgroup>
          <optgroup label="Latin">
            <option value="Liberation Serif, Times New Roman, serif">Liberation Serif</option>
            <option value="Liberation Sans, Arial, sans-serif">Liberation Sans</option>
            <option value="Times New Roman, serif">Times New Roman</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Calibri, sans-serif">Calibri</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Courier New, monospace">Courier New</option>
            <option value="Comic Sans MS, cursive">Comic Sans MS</option>
          </optgroup>
        </select>
        <select class="lo-combo lo-size" id="size-select" title="Font size">
          <option>8</option><option>9</option><option>10</option><option>11</option>
          <option selected>12</option><option>14</option><option>16</option><option>18</option>
          <option>20</option><option>24</option><option>28</option><option>36</option>
          <option>48</option><option>72</option>
        </select>
        <span class="lo-tb-sep"></span>

        <button class="lo-tb-btn" data-cmd="bold" title="Bold"><b>B</b></button>
        <button class="lo-tb-btn" data-cmd="italic" title="Italic"><i>I</i></button>
        <button class="lo-tb-btn" data-cmd="underline" title="Underline"><u>U</u></button>
        <button class="lo-tb-btn" data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button>
        <label class="lo-tb-color" title="Font color">
          <span class="lo-color-glyph" style="border-bottom-color:#c00">A</span>
          <input type="color" id="fore-color" value="#cc0000">
        </label>
        <label class="lo-tb-color" title="Highlighting color">
          <span class="lo-color-glyph lo-hl">▉</span>
          <input type="color" id="back-color" value="#ffff00">
        </label>
        <span class="lo-tb-sep"></span>

        <button class="lo-tb-btn" data-cmd="justifyLeft" title="Align left">⯇</button>
        <button class="lo-tb-btn" data-cmd="justifyCenter" title="Center">≡</button>
        <button class="lo-tb-btn" data-cmd="justifyRight" title="Align right">⯈</button>
        <button class="lo-tb-btn" data-cmd="justifyFull" title="Justified">☰</button>
        <span class="lo-tb-sep"></span>

        <button class="lo-tb-btn" data-cmd="insertUnorderedList" title="Bullet list">•</button>
        <button class="lo-tb-btn" data-cmd="insertOrderedList" title="Numbered list">1.</button>
        <button class="lo-tb-btn" data-cmd="outdent" title="Decrease indent">⇤</button>
        <button class="lo-tb-btn" data-cmd="indent" title="Increase indent">⇥</button>
        <button class="lo-tb-btn lo-tb-end" data-act="toggle-ai" id="toggle-ai"
          title="Show / hide AI assistant">🗨 AI</button>
      </div>

      <!-- Document canvas -->
      <div id="editor-canvas">
        <div id="page-wrap">
          <div class="page">
            <div id="page-backdrop" aria-hidden="true"></div>
            <div id="editor" contenteditable="true" spellcheck="true">
              <h1>Welcome to AI Words</h1>
              <p>Open an <strong>ODT</strong> file, edit it here, and export it when done.
                 Use the assistant on the right to read and edit this document with AI.</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Status bar -->
      <footer class="lo-statusbar">
        <span id="doc-name">Untitled</span>
        <span class="lo-sb-sep"></span>
        <span id="page-count">1 page</span>
        <span class="lo-sb-sep"></span>
        <span id="word-count">0 words</span>
        <span class="lo-sb-spacer"></span>
        <label class="lo-zoom">
          <input type="range" id="zoom-range" min="20" max="400" step="5" value="100">
          <span id="zoom-label">100%</span>
        </label>
      </footer>
    </section>

    <!-- Divider -->
    <div id="divider"></div>

    <!-- Right: AI assistant - filled in by ai-pane.js, same as on /latex -->
    <section id="ai-pane"></section>
  </div>

  <script src="/static/ui.js?v=1"></script>
  <script src="/static/ai-pane.js?v=3"></script>
  <script src="/static/app.js?v=5"></script>
</body>
</html>
